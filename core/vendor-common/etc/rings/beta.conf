# Nowhere store-config RING template: beta. NON-SECRET -- contains NO store credentials.
#
# stage-vendor.sh bakes this to /system/etc/nowhere/nowhere.conf when NOWHERE_RING=beta, so a beta
# device is turnkey and survives the amnesia wipe (a read-only /system conf can't be lost the way a
# provisioned /data/nowhere/nowhere.conf can). A prod/stable build sets no ring -> nothing is baked ->
# the OS ships un-enrolled, exactly as today.
#
# Cap-mode (#104): a managed device holds NO store credentials. It needs only the gateway URL -- it
# fetches the blind issuer's public key at runtime (GET $GATEWAY_URL/issue/pubkey) and reads/writes the
# store through short-lived per-ref caps. So pointing the whole OS at the beta stack is exactly this one
# line: beta's own issuer/blind keys, R2 bucket, and test-Stripe storefront all live behind api-beta.
#
# Deliberately NO S3_* keys here -> the login daemon selects cap-mode (GATEWAY_URL set, no creds).
# LF line endings ONLY: a trailing CR breaks the agent's conf parse (stage-vendor strips CR to be safe).
GATEWAY_URL=https://api-beta.nowhere.mobile

# Activation jitter OFF on beta (DIA-20260809-15). A plan normally waits a random 0-2 days before it
# activates, so a redemption cannot be matched to a purchase by timestamp -- correct for a customer,
# useless when someone is standing at the phone waiting to see whether the plan landed at all.
# Production ships with NO ring, so it keeps the default delay.
ACTIVATION_JITTER_EPOCHS=0

# NOWHERE_SEQ_GUARD=1 -- REFUSE a seal whose base is no longer current (NWP-20260907-13), ON for beta
# so it can be MEASURED on real handsets. The code default stays 0; this is the staged-rollout lever,
# the same one NOWHERE_MULTIDEVICE and NOWHERE_CARRY_ESSENTIAL use.
#
# WHY IT IS SET HERE RATHER THAN ON THE DEVICE. Baking it in the ring is the lever that reaches every
# device without one-by-one provisioning, and frankel is a locked user build with no adb, so there is no
# way to hand-write a /data conf there at all.
#
# ⚠ THIS PARAGRAPH USED TO SAY THE RING WAS THE ONLY LEVER *BECAUSE* /data REPLACES /system RATHER THAN
# MERGING. That was true and it was the bug, not the reason -- and it is why this flag was never actually
# live: every fielded handset carries a /data conf, so the ring value was discarded on all of them
# (NWP-20260907-22 measured 29 detections with refusal=false throughout). NWP-20260908-06 made the load a
# MERGE, so a ring value now reaches a provisioned device -- which is exactly why the line below changed.
#
# WHAT IT CHANGES: a seal whose base head is no longer current is REFUSED rather than silently
# overwriting the newer state. Detection and the "STALE BASE" log line are always on regardless; this
# only decides the refusal. The measurement question is how often it fires in ordinary use -- both for
# genuine two-handset divergence (what it is for) and after a LOCAL keyslot change on one handset
# (enrol, revoke, PIN, rotate), which moves the head too and would make the guard too blunt.
#
# ⚠ THIS IS THE WHOLE BETA RING, NOT JUST THE PAIR BEING MEASURED. stallion and tegu are on 0.5.21 and
# do not receive this build, so nothing changes for them today -- but the next image they take will
# carry it. Revert this line before that if the measurement says the guard is too blunt.
#
# ⚠⚠ SET TO 0 BY NWP-20260908-06, AND THE MEASUREMENT IS THE REASON. The conf merge landed in the same
# slice, so for the first time this value would actually REACH a provisioned handset. Turning the refusal
# on as a side effect of a delivery fix would be shipping a decision nobody made, and the measurement it
# was set for has already reported: NWP-20260907-22 found 29 genuine detections across ALL FOUR data
# scopes in one evening, and concluded that arming the refusal would be "actively wrong" while two
# handsets diverge by construction.
#
# WHAT ARMING IT WOULD DO TODAY: roamd maps agent exit 4 to ERR-REFUSED for the WHOLE logoff and the
# session stays signed in, so a refused seal on ANY data scope wedges sign-out -- not just #media, which
# is the only scope the NWP-20260908-04 carry exempts. The line above is kept rather than deleted because
# under the merge an explicit 0 is now the way to turn a setting OFF: omitting a key leaves the other
# file’s value standing.
#
# TURN IT BACK ON when a divergent seal has a resolution that is not "lose one side" -- that is the open
# product decision in docs/product-decisions.md, not an engineering toggle.
NOWHERE_SEQ_GUARD=0

# NOWHERE_CARRY_ESSENTIAL_MEDIA=1 -- the per-rel essential index and carry for the shared #media head
# (#91, NWP-20260908-04). ON for beta.
#
# WHAT IT FIXES. #media is ACCOUNT-shared under both settings of NOWHERE_MULTIDEVICE, so two signed-in
# handsets write one ref. Without this, a seal from the handset that has not materialised the other’s
# photos publishes a head WITHOUT them: the bytes lose their lease and the store GC reaps them, so the
# photo is gone from the ACCOUNT, not just from that phone. Device-proven as a livelock on frankel + lynx
# (NWP-20260907-20) and reproduced off-device. With it, every essential rel the stored head names that this
# handset never received is re-emitted BY HASH -- nothing fetched, nothing re-uploaded.
#
# WHAT IT DOES NOT FIX: the two heads still differ. Carried spans are appended rather than interleaved in
# rel order, and directory entries ride an un-indexed grouped chunk no per-file index can name. It removes
# the data LOSS, not the churn -- do not read this flag as convergence.
#
# ONE-OFF COST: the first seal under this flag re-chunks the #media ESSENTIAL set once, one region per
# file. On a real camera roll that is a large single upload. The DEFERRED bulk -- where the volume is --
# is untouched, because deferred files are chunked from raw bytes with no tar entry at all.
#
# NOT A ROLLOUT CONSTRAINT. A handset WITHOUT this flag re-seals #media GROUPED, which against a file-aligned
# head is a ~5x CHUNK collapse over identical data. That seal is no longer refused: since NWP-20260908-11 the
# shrink guard compares FILE counts when the stored head is file-aligned and the seal is not, so there is no
# order in which the two handsets must be updated and no sign-in sequence to follow.
#
# It reaches a provisioned device only because NWP-20260908-06 made the conf load a MERGE. Before that a
# /data conf discarded every ring key it did not repeat, which is how NOWHERE_SEQ_GUARD was measured for
# an evening without ever being set.
NOWHERE_CARRY_ESSENTIAL_MEDIA=1

# STOREFRONT_URL -- where the chooser sends someone who wants to BUY storage (NWP-20260921-11).
#
# Chester, 2026-09-21: "on beta os, Profile->Storage->Plans & buying storage is all pointing to prod."
# It was not a misconfiguration -- there was nothing to configure. PLANS_URL was a compile-time constant
# (`https://nowhere.mobile/buy`) and no ring-aware storefront key existed anywhere in the tree, so a beta
# image had no mechanism by which it could point anywhere else.
#
# Prod ships with NO ring, so it bakes nothing and the agent's own default (nowhere.mobile) stands --
# which is why this is an ADDITIVE key and not a behaviour change for prod.
#
# ⚠ The value is the storefront ORIGIN, with no path: the chooser appends /buy itself, so the two halves
# cannot drift. A trailing slash is tolerated and stripped.
STOREFRONT_URL=https://beta.nowhere.mobile
